openapi: 3.0.0
info:
  title: IActus
  description: "Backend IActus (Boussole) : API mobile (journal politique temps réel), portail client web et administration."
  version: "0.12.0-20261009083227"

servers:
  - url: "/"

tags:
  - name: general
    description: Health and readiness probes
  - name: mobile
    description: Mobile API (customer JWT)
  - name: admin
    description: Yacast internal authentication (ACL)

paths:
  /healthz:
    get:
      summary: "Checks if service is running"
      operationId: "routeHealthz"
      tags: [general]
      responses:
        200:
          description: "Service is running"

  /readiness:
    get:
      summary: "Checks if service is ready to handle requests"
      operationId: "routeReadiness"
      tags: [general]
      responses:
        200:
          description: "Service is ready"
        503:
          description: "Service is not ready"

  /auth:
    post:
      summary: "Authenticates a Yacast internal user against the ACL service (admin area)"
      operationId: "routeAuth"
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        201:
          description: "JWT issued"
        401:
          description: "Invalid credentials"

  /rest/v1/auth/login:
    post:
      summary: "Authenticates a mobile app and registers (or transfers) the device"
      operationId: "routeMobileLogin"
      tags: [mobile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device_uid]
              properties:
                email: { type: string }
                password: { type: string }
                device_uid: { type: string, description: "Stable per-install identifier" }
                device_name: { type: string }
                device_model: { type: string }
                replace_device_id:
                  type: integer
                  description: "Device to revoke when the quota is reached (transfer)"
      responses:
        201:
          description: "JWT issued"
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expires: { type: integer }
                  device_id: { type: integer }
                  email: { type: string }
                  fullname: { type: string }
                  organisation: { type: string }
        401:
          description: "Invalid credentials"
        403:
          description: "Subscription inactive"
        409:
          description: "Device quota reached; body lists registered devices for a transfer"

  /rest/v1/feed:
    get:
      summary: "Live journal: interventions, citations and posts on X, newest first. Serves the head (the newest items, limit at most) and then what was observed since (polling); the items before the head are read from /rest/v1/history."
      operationId: "routeMobileFeed"
      tags: [mobile]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: since_seq
          in: query
          schema: { type: integer }
          description: "Observation cursor: 0 asks for the head of the journal, otherwise only items observed after this seq. Send back the last_seq of the previous response."
        - name: persons
          in: query
          schema: { type: string }
          description: "Comma-separated person names"
        - name: parties
          in: query
          schema: { type: string }
          description: "Comma-separated party codes, as /parties lists them (the party's label)"
        - name: kinds
          in: query
          required: false
          schema: { type: string }
          description: "Comma-separated kinds to keep: intervention, citation, tweet. Every kind when absent."
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        200:
          description: "Feed page, with the last_seq cursor for the next poll"

  /rest/v1/persons:
    get:
      summary: "Panel personalities (filter sheet)"
      operationId: "routeMobilePersons"
      tags: [mobile]
      security: [{ bearerAuth: [] }]
      responses:
        200:
          description: "Personalities"

  /rest/v1/parties:
    get:
      summary: "Panel parties (filter sheet)"
      operationId: "routeMobileParties"
      tags: [mobile]
      security: [{ bearerAuth: [] }]
      responses:
        200:
          description: "Parties"

  /rest/v1/sequences/{id}:
    get:
      summary: "Sequence detail: title, summary, verbatim, playlist path, and where the passage (play_from, duration_sec) and the verbatim's speech (speech_start, speech_duration_sec) sit in the media. kind is intervention, citation or tweet (a post on X: media x, channel_key x, url of the post, no media file); channel_key names the embedded channel logo"
      operationId: "routeMobileSequence"
      tags: [mobile]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: "Sequence"
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, description: "Same id as in /feed and /history" }
                  seq: { type: integer }
                  at: { type: string, format: date-time, description: "Broadcast time (start of the intervention, instant of the mention, time of the post)" }
                  kind: { type: string, enum: [intervention, citation, tweet] }
                  media: { type: string, enum: [tv, radio, x] }
                  channel: { type: string }
                  channel_key: { type: string, description: "Key of the embedded channel logo" }
                  show: { type: string }
                  person: { type: string, description: "The personality: who speaks (intervention), who is named (citation), who posted (tweet)" }
                  role: { type: string }
                  party: { type: string }
                  title: { type: string, description: "Title of the item: the LLM title of the intervention, (person) + the title of the covering intervention for a citation; when there is none, the start of the verbatim in « »" }
                  cited_by: { type: string, description: "Who was speaking when the citation was made; on a retweet, whose post is relayed" }
                  url: { type: string, description: "The post on X (tweets only)" }
                  duration_sec: { type: integer, description: "Length of the passage played from play_from" }
                  has_media: { type: boolean }
                  video: { type: boolean }
                  resume:
                    type: string
                    description: "Summary of the topic the item belongs to: iActusAPI's summary of the editorial sequence the item falls in (a few minutes on one subject, often with several speakers), not a summary of the item itself. Empty when there is none (ads, music, posts on X, items stored before 2026-10-08); never a copy of the verbatim."
                  verbatim: { type: string, description: "Transcription: the whole intervention, the whole speech holding the mention for a citation, the text of a post. Empty when unknown" }
                  play_from: { type: string, format: date-time, description: "Where the passage starts in the media" }
                  speech_start: { type: string, format: date-time, description: "Where the verbatim starts in the media; absent without verbatim" }
                  speech_duration_sec: { type: integer, description: "Length of the verbatim in the media" }
                  playlist: { type: string, description: "HLS playlist path of the passage; absent without media" }
        404:
          description: "Unknown sequence: neither in the live journal nor in the history (65 days)"

  /rest/v1/sequences/{id}/words:
    get:
      summary: "Word timing of the sequence's verbatim, read from the STT service and cached by the backend: the transcribed sentences over the speech, each with its words, times in milliseconds relative to origin (= play_from)"
      operationId: "routeMobileWords"
      tags: [mobile]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: "Word timing"
          content:
            application/json:
              schema:
                type: object
                properties:
                  sequence: { type: integer }
                  origin: { type: string, format: date-time, description: "play_from of the sequence; every *_ms below counts from it" }
                  sentences:
                    type: array
                    items:
                      type: object
                      properties:
                        text: { type: string }
                        start_ms: { type: integer }
                        end_ms: { type: integer }
                        words:
                          type: array
                          items:
                            type: object
                            properties:
                              text: { type: string }
                              start_ms: { type: integer }
                              end_ms: { type: integer }
        404:
          description: "Unknown sequence, or no STT source configured (the app then estimates the words from the speech rate)"
        502:
          description: "The STT service did not answer"

  /rest/v1/hls/{id}/{file}:
    get:
      summary: "HLS proxy: playlist (index.m3u8) and segments of a sequence"
      operationId: "routeMobileHLS"
      tags: [mobile]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: file
          in: path
          required: true
          schema: { type: string }
        - name: margin
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 60, default: 0 }
          description: "Seconds of context served before and after the passage (the playlist's segments repeat it). The playlist carries EXT-X-PROGRAM-DATE-TIME so the player can locate play_from in its window."
      responses:
        200:
          description: "Media stream"
        404:
          description: "Unknown media"

  /rest/v1/history:
    get:
      summary: "Journal history: the items of a window, newest first, paged on the item id (the app's infinite scroll over 24 hours, 7 or 31 days, or one day). Items have the same id as in /feed; their seq is 0 and must never feed last_seq."
      operationId: "routeMobileHistory"
      tags: [mobile]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          schema: { type: string }
          description: "Window start, inclusive: Unix milliseconds, RFC 3339 (encode the + of an offset as %2B, or use Z), or a YYYY-MM-DD Paris day (its midnight). Default: to minus 24 hours."
        - name: to
          in: query
          schema: { type: string }
          description: "Window end, exclusive, same formats; a YYYY-MM-DD day is inclusive (the next midnight). Default: now. The window spans at most 31 Paris days."
        - name: before_id
          in: query
          schema: { type: integer }
          description: "Only items with a lower id: the id of the last item of the previous page."
        - name: persons
          in: query
          schema: { type: string }
          description: "Comma-separated person names"
        - name: parties
          in: query
          schema: { type: string }
          description: "Comma-separated party codes, as /parties lists them (the party's label)"
        - name: kinds
          in: query
          schema: { type: string }
          description: "Comma-separated kinds to keep: intervention, citation, tweet. Every kind when absent."
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        200:
          description: "A page of items and whether older ones remain"
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object } }
                  has_more: { type: boolean }
        400:
          description: "Unreadable bound, from not before to, window over 31 Paris days, before_id not a positive id, unknown kind, or limit out of range"
        502:
          description: "The history could not be read"
        503:
          description: "History unavailable (only the live window can be served)"

  /rest/v1/days:
    get:
      summary: "Day frise: the items of the last complete Paris days (yesterday last, today left out: the 7 and 31 days are fixed, they do not slide with the clock), or of the days from..to (a calendar week or month), oldest first, zero days included. Every kind is counted, each in its column: the app stacks the kinds it shows."
      operationId: "routeMobileDays"
      tags: [mobile]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: days
          in: query
          schema: { type: integer, default: 7, minimum: 1, maximum: 31 }
          description: "The last complete days, yesterday last. Not with from and to."
        - name: from
          in: query
          schema: { type: string, format: date }
          description: "First Paris day, YYYY-MM-DD, included; with to"
        - name: to
          in: query
          schema: { type: string, format: date }
          description: "Last Paris day, YYYY-MM-DD, included, not after today; 31 days at most from from"
        - name: persons
          in: query
          schema: { type: string }
          description: "Comma-separated person names"
        - name: parties
          in: query
          schema: { type: string }
          description: "Comma-separated party codes, as /parties lists them (the party's label)"
      responses:
        200:
          description: "One entry per day"
          content:
            application/json:
              schema:
                type: object
                properties:
                  days:
                    type: array
                    items:
                      type: object
                      properties:
                        day: { type: string, description: "YYYY-MM-DD, Paris" }
                        interventions: { type: integer }
                        citations: { type: integer }
                        tweets: { type: integer }
                        intervention_sec: { type: integer, description: "Seconds of the interventions" }
        400:
          description: "days out of range, from without to (or the reverse), with days, reversed, over 31 days or after today"
        503:
          description: "History unavailable"

  /rest/v1/profile:
    get:
      summary: "Activity of a person of the panel over the last complete days (as /days, today left out) or the days from..to: totals, one entry per Paris day and the 5 channels the person intervened the longest on. intervention_sec sums the interventions of the journal, not the official speaking time."
      operationId: "routeMobileProfile"
      tags: [mobile]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: person
          in: query
          required: true
          schema: { type: string }
          description: "Person name, as /persons lists it"
        - name: days
          in: query
          schema: { type: integer, default: 7, minimum: 1, maximum: 31 }
          description: "The last complete days, yesterday last. Not with from and to."
        - name: from
          in: query
          schema: { type: string, format: date }
          description: "First Paris day, YYYY-MM-DD, included; with to"
        - name: to
          in: query
          schema: { type: string, format: date }
          description: "Last Paris day, YYYY-MM-DD, included, not after today; 31 days at most from from"
      responses:
        200:
          description: "Profile: person, totals, days, top_channels"
        400:
          description: "Missing person or days out of range"
        404:
          description: "Unknown person"
        503:
          description: "History unavailable"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
